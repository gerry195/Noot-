name: noot
description: Noot, aplikasi catatan harian berbasis Flutter yang berjalan sebagai PWA.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/noot app logo.png

  fonts:
    - family: Pagella
      fonts:
        - asset: assets/fonts/texgyrepagella-regular.otf
        - asset: assets/fonts/texgyrepagella-italic.otf
          style: italic
        - asset: assets/fonts/texgyrepagella-bold.otf
          weight: 700
        - asset: assets/fonts/texgyrepagella-bolditalic.otf
          weight: 700
          style: italic
